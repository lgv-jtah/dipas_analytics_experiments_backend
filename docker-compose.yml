services:
  api:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTP_PROXY:-}
        NO_PROXY: ${HTTP_PROXY:-}
    ports:
      - "8000:8000"
    environment:
      # PINNED to mistral-nemo: the key-message highlight spans in the export below
      # are character offsets into THIS model's contributionContent. The backend
      # serves that same contribution_content, so the offsets only line up while
      # PARQUET_PATH stays on mistral-nemo. Changing the model here would shift the
      # displayed text and make every highlight point at the wrong passage.
      # Must match the mounted path below.
      - PARQUET_PATH=/app/whole_process_contributions_with_comments_250_mistral-nemo_mistral-nemo.parquet
      # Point the backend at the export that carries the key-message highlight
      # spans alongside the key-message and overall-summary artifacts.
      - VOTE_STANCE_EXPORT_DIR=/app/data_exports/votes_stance_20261119T115612671036Z
    volumes:
      - ./evaluations.db:/app/evaluations.db
      - ./whole_process_contributions_with_comments_250_deepsseek-v4-pro_deepsseek-v4-pro.parquet:/app/whole_process_contributions_with_comments_250_deepsseek-v4-pro_deepsseek-v4-pro.parquet
      - ./whole_process_contributions_with_comments_250_mistral-nemo_mistral-nemo.parquet:/app/whole_process_contributions_with_comments_250_mistral-nemo_mistral-nemo.parquet
      # Frozen votes-vs-stance export (read-only); see README "The data export".
      - ./data_exports/votes_stance:/app/data_exports/votes_stance:ro
      # Export adding the per-key-message and overall-summary artifacts.
      - ./data_exports/votes_stance_20261105T151906907735Z:/app/data_exports/votes_stance_20261105T151906907735Z:ro
      # Newest export, adding the per-key-message highlight spans.
      - ./data_exports/votes_stance_20261119T115612671036Z:/app/data_exports/votes_stance_20261119T115612671036Z:ro
